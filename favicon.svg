<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a7d3b"/>
      <stop offset="100%" stop-color="#1e5420"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Leaf accent -->
  <path d="M390 90c0 0-60 20-100 80s-50 120-50 120s60-20 100-80s50-120 50-120z" fill="rgba(255,255,255,.12)"/>
  <path d="M370 100c-30 40-60 100-50 120" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
  <!-- P -->
  <text x="90" y="370" font-family="system-ui,-apple-system,sans-serif" font-weight="800" font-size="300" fill="#fff" letter-spacing="-12">P</text>
  <!-- D P smaller -->
  <text x="250" y="340" font-family="system-ui,-apple-system,sans-serif" font-weight="700" font-size="160" fill="rgba(234,244,238,.88)" letter-spacing="-6">DP</text>
  <!-- Produce underline -->
  <rect x="86" y="388" width="340" height="6" rx="3" fill="rgba(255,255,255,.35)"/>
</svg>
