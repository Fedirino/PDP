name: Deploy PDP to Firebase

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting + Firestore
        uses: w9jds/firebase-action@v13.22.1
        with:
          args: deploy --only hosting,firestore --project producedepartmentportal
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRODUCEDEPARTMENTPORTAL }}
