# Netlify configuration for the Produce Department Portal

[build]
  # Static site — no build step. Functions live in this folder.
  publish = "."
  functions = "netlify/functions"

# Map the clean path the app calls (/api/scan) to the serverless function.
[[redirects]]
  from = "/api/scan"
  to = "/.netlify/functions/scan"
  status = 200
  force = true
